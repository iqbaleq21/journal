# Hanya penyesuaian dari config bawaan detekt (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Implementasi repository: jumlah fungsinya ditentukan interface, jadi yang dihitung hanya fungsi milik kelas.
    ignoreOverridden: true

style:
  MagicNumber:
    # Token desain (warna, ukuran huruf, radius) memang berupa angka literal; tes memakai data contoh.
    excludes: ['**/ui/theme/**', '**/test/**', '**/androidTest/**']
    # Angka boleh muncul saat diberi nama sebagai properti/konstanta.
    ignorePropertyDeclaration: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
